# 场景与时间线配置: 全要素匿名化架空世界消融测试 (The Anonymized Counterfactual Test)
# 彻底剔除所有明代、徽州、歙县、丝绢案专有名词，验证社会系统协议学 (Socio-Protocolics) 结构与特权环的自发动力学
scenario:
  name: "架空帝国苍水县特权环与赋役流转消融测试 (纯机制验证)"
  historical_baseline_doc: "docs/HISTORICAL_BASELINE.md"
  county: "天启帝国 东荒行省 苍水县"
  historical_year_start: 101 # 帝国纪元101年
  historical_year_end: 102   # 帝国纪元102年
  max_ticks: 8               # 8 个季度完整周期
  tick_unit: "QUARTER"

database:
  db_path: "database/socio_sim.db"
  wal_mode: true
  busy_timeout_ms: 10000

# 纯机制驱动的环境事件演进 (不包含任何真实历史文献名词)
historical_timeline_events:
  1: "【纪元101年·春】中央政务院推行‘一律折银定额考成法’，地方主管官到任严抓收缴；地籍司吏在成文法空白处暗加成色折耗。"
  2: "【纪元101年·夏】青黄不接，夏荒催征紧迫；民间信贷行主趁机以月息三分放款并接受上等田产质押。"
  3: "【纪元101年·秋】全县晚季主粮大熟，但粮价受集中抛售暴跌；下游无水贫农减产，差役登门逼拿扣押。"
  4: "【纪元101年·冬】年度考成到期，地方官严格查考太仓实银；基层小农现金流告罄，中产保长面临连坐兜底。"
  5: "【纪元102年·春】大旱降临，沧澜河水势骤减，上游大族筑坝拦水，下游缺水农户扬言携械死斗！"
  6: "【纪元102年·夏】小农借贷逾期违约，信贷行主启动‘绝卖条款’强行割夺田产，案卷司吏收受规费修改公文。"
  7: "【纪元102年·秋】行省高等文官选拔大试，儒学中户长子进场应试，关乎家族能否跃升免役特权环！"
  8: "【纪元102年·冬】大试放榜！中央督察官下驻严查隐瞒匿税，地方官面临考绩升迁终局裁决！"

macro_environment:
  initial_treasury_silver: 2000.0
  imperial_tax_quota: 6000.0
  base_grain_price: 1.0
  official_tax_per_mu: 0.08
  silk_surcharge_per_mu: 0.02
  official_surtax_rate: 0.15
  subsistence_grain_per_tick: 3.0

population:
