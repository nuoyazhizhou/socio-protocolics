      name: "张主政 (地方主管行政官)"
      role_type: "magistrate"
      privilege_ring: 1
      model: "deepseek-flash"
      temperature: 0.4
      background: "中央外派流官，任期有限，急于完成中央下达的折银考成指标以获拔擢，对基层土地实情缺乏穿透力"
      initial_assets: { silver: 150.0, grain: 60.0, land: 0.0 }

    - id: "assistant_li"
      name: "李佐贰 (分管粮道水利副官)"
      role_type: "vice_magistrate"
      privilege_ring: 1
      model: "deepseek-flash"
      temperature: 0.4
      trait: "PRAGMATIC_BUREAUCRAT"
      background: "本土长期任职副官，深谙本土宗族势力盘根错节，分管粮仓与水利调配，行事讲求中庸自保"
      initial_assets: { silver: 90.0, grain: 45.0, land: 20.0 }

  clerks:
