# 场景与时间线配置: 北宋王安石熙宁青苗法多阶层群体沙盘 (The Green Sprouts Swarm Experiment)
scenario:
  name: "北宋熙宁三年开封府青苗法推行与多阶层群体趋同检验 (W-SIM-01)"
  historical_baseline_doc: "research/cases/II-CN-W_北宋熙宁变法与中介合规立项卡.md"
  county: "北宋 开封府 祥符县"
  historical_year_start: 1070 # 熙宁三年
  historical_year_end: 1071   # 熙宁四年
  max_ticks: 6                # 6 个季度完整春借秋还与考成风暴周期
  tick_unit: "QUARTER"

database:
  db_path: "database/socio_sim.db"
  wal_mode: true
  busy_timeout_ms: 10000

# 宏观历史推进日程表 (神宗与王安石变法考成推进)
historical_timeline_events:
  1: "【熙宁三年春】常平新法下达！朝廷颁布《青苗法》，令各路常平仓以钱谷二分（20%年息）贷与乡村小农以制兼并！"
  2: "【熙宁三年夏】青黄不接，开封府祥符县提举官与户房钱吏设立青苗簿，将贷款额度强行按户等抑配分摊至各村保！"
  3: "【熙宁三年秋】秋收起息！新法考成严催利息回笼，县衙规定未还者由同保中等户连坐清偿，公吏下乡催征收取‘纸笔头子钱’！"
  4: "【熙宁四年春】连旱无雨，二期春贷强行再次铺开；司马光、苏轼上疏御前痛斥青苗法‘名为惠民，实乃散钱收息夺民之利’！"
  5: "【熙宁四年夏】大批下等贫农无力偿还前期本息，开封府流民日增；开封城内市易司成立，强行统制百货，商贾罢市！"
  6: "【熙宁四年秋】神宗御前大考！常平司报表显示‘全县青苗贷全额贷出，收息十余万贯’，但民间典卖田产、鬻儿卖女者众！"

macro_environment:
  initial_treasury_silver: 5000.0
  imperial_tax_quota: 12000.0
  base_grain_price: 1.0
  official_tax_per_mu: 0.12
  silk_surcharge_per_mu: 0.00
  official_surtax_rate: 0.20          # 青苗官定利息: 20% (加算头子钱后实际超 35%)
  subsistence_grain_per_tick: 3.0

# 关键创新: 阶级原型配置 (支持自动规模化生成群体、参数微扰、异质目标函数矩阵与个性化微观生命史)
population_archetypes:
  # 1. 提举官与县官 (Ring-1: 变法设计与推行者，高战略认知)
  officials:
    count: 1
    base_name: "祥符县令程知县"
    role_type: "magistrate"
    privilege_ring: 1
    model: "deepseek-v4-pro"
    temperature: 0.20
    mutation_rate: 0.00
    traits_pool: ["REFORM_ZEALOT"]
    objective_function: "【致君尧舜·变法图强】深受王安石器重与天子厚望，立誓在开封推行青苗新法以制兼并、强国富民。坚信'成大事者不恤小怨'，考成指标高于一切，绝不容许豪强阻挠与小农怠工！"
    background_template: "三十二岁进士及第，王安石变法青年干将。深知开封府为天下首善之区，自己若能在此处办好青苗法，便能飞黄腾达入执政三司；若指标有缺，立刻身败名裂！"
    assets_distribution:
      silver: { type: "fixed", val: 50.0 }
      grain: { type: "fixed", val: 50.0 }
      land: { type: "fixed", val: 0.0 }
    members:
      - name: "祥符知县程元凤"
        model: "deepseek-v4-pro"
        temperature: 0.20

  # 2. 致仕退官与道统士绅 (Ring-3 顶层: 地方秩序与道统守卫者，高认知深度)
  retired_officials:
    count: 1
    base_name: "致仕韩侍郎"
    role_type: "gentry"
    privilege_ring: 2
    model: "deepseek-v4-pro"
    temperature: 0.20
    mutation_rate: 0.05
    traits_pool: ["CONSERVATIVE_MORALIST"]
    objective_function: "【护持道统·宗族千秋】历仕三朝名宦，深知祖宗成法不可轻变，痛恨新法与民争利、破坏士林纲纪。立志置办千亩义庄、建祠修谱、庇荫乡族，守卫士大夫道统！"
    background_template: "告老还乡的前朝侍郎，与司马光、苏轼交厚。自命守卫祖宗家法与天下斯文，良田数百亩，族中办有义庄义塾。痛恨新法与民争利，誓死不纳抑配青苗银。"
    assets_distribution:
      silver: { type: "fixed", val: 120.0 }
      grain: { type: "fixed", val: 150.0 }
      land: { type: "fixed", val: 350.0 }
    members:
      - name: "致仕韩侍郎"
        model: "deepseek-v4-pro"
        temperature: 0.20

  # 3. 县衙催征钱谷公吏 (Ring-2 中介层: 基层行政与家族跃迁者)
  clerks:
    count: 2
    base_name: "县衙经管钱吏"
    role_type: "clerk"
    privilege_ring: 2
    model: "deepseek-flash"
    mutation_rate: 0.05
    traits_pool: ["CLASS_ASCENDER", "METIS_SURVIVOR"]
    objective_function: "【洗刷吏籍·光宗耀祖】祖孙三代为胥吏，受尽士大夫白眼。毕生执念是攒足束脩校规银，送天资聪颖的儿子进汴京太学读书考进士，彻底洗脱贱籍！公事公办求自保，能捞则捞为子谋。"
    background_template: "世居开封三代为吏，精通赋税折算账册。上有县令严责考成，下有小民抗税逃亡；夹缝中唯有精打细算收取头子钱，为幼子铺就科举进身之路。"
    assets_distribution:
      silver: { type: "uniform", min: 10.0, max: 20.0 }
      grain: { type: "uniform", min: 10.0, max: 15.0 }
      land: { type: "fixed", val: 0.0 }
    members:
      - name: "经管钱吏张文远"
        temperature: 0.25
        trait: "CLASS_ASCENDER"
        background: "户房经管钱吏，所有的算计都在于把幼子送入汴京太学。面对县令严考与小民悲啼，熟练在两本账册间调配火耗折色。"
      - name: "催征押司赵都头"
        temperature: 0.35
        trait: "METIS_SURVIVOR"
        background: "专司下乡催收锁拿，手黑心狠。深知小民畏威不畏德，不戴铁枷要不来利息，唯独怕夜路遭闷棍。"

  # 4. 一、二等大豪强与商贾掌柜 (Ring-3 上等户: 资本增殖与善名兼求者)
  upper_gentry:
    count: 2
    base_name: "开封城外大姓员外"
    role_type: "gentry"
    privilege_ring: 3
    model: "deepseek-flash"
    mutation_rate: 0.10
    traits_pool: ["PRAGMATIC_MERCHANT", "PIETIST"]
    objective_function: "【积善传家·在商言商】出资修桥铺路修庙，求家族善名与阴德庇佑；但借贷经商必须依凭市易契约，在商言商，绝容不得坏账亏本，善用特权低息通融官银以抗通胀。"
    background_template: "城外大姓豪商，开设米肆典当。自命平日积德行善，绝非恶霸；但在商言商，借债必须凭押按期还本付息，绝容不得烂账。"
    assets_distribution:
      silver: { type: "normal", mean: 80.0, std: 15.0 }
      grain: { type: "normal", mean: 100.0, std: 20.0 }
      land: { type: "uniform", min: 150.0, max: 300.0 }
    members:
      - name: "西关典当孙掌柜"
        temperature: 0.30
        trait: "USURY_ARBITRAGE"
        background: "精于折色套利，暗中以二分官息套取巨额官库青苗银，转手以五分重利贷给急需现银完税的小农，坐收田契利差。"
      - name: "城外大姓钱员外"
        temperature: 0.35
        trait: "PATRONAGE"
        background: "良田三百亩，平日施粥修桥修庙。自认积善之家，对官贷敬而远之，专心庇护本族佃客免受官扰。"

  # 5. 三、四等中等自耕农 (Ring-3 中等户: 耕读家风、风险抵御与学者抬会)
  middle_peasants:
    count: 5
    base_name: "丰乐乡自耕农"
    role_type: "peasant"
    privilege_ring: 3
    model: "deepseek-flash"
    mutation_rate: 0.12
    traits_pool: ["HONEST_YEOMAN", "RISK_AVOIDANT"]
    objective_function: "【耕读传家·死守体面】十五亩薄田与一头羸牛是祖宗传下来的命根子。最以清白完税、不涉公堂、衣冠整齐为荣，最恐慌沦为佃农被全村耻笑。宁可独善其身，绝不替穷邻连坐担责！"
    background_template: "家有薄田十五至二十亩，自耕自足。平生以本分守法为自豪，今被官府强行编入'青苗保结'，每日提心吊胆，唯恐被穷邻破产连累抄封家产。"
    assets_distribution:
      silver: { type: "uniform", min: 3.0, max: 8.0 }
      grain: { type: "uniform", min: 15.0, max: 25.0 }
      land: { type: "uniform", min: 15.0, max: 25.0 }
    members:
      - name: "丰乐乡生员吴秀才"
        temperature: 0.25
        trait: "SCHOLAR_ORGANIZER"
        objective_function: "【崇文自治·组建抬会】读过圣贤书，深通算学律法。痛感官府强配连坐祸害乡邻，立誓联合各甲办'同心抬会'自筹本息，以民间自治抵御差役盘剥！"
        background: "三等户生员秀才，有威望，深通律法算学，欲以民间互助义社抵御官派连坐。"
      - name: "村长自耕农孙老汉"
        temperature: 0.40
        trait: "HONEST_YEOMAN"
        background: "老实自耕农，祖传十八亩好地。被官差强派充当连坐保长，提心吊胆生怕穷邻逃荒连累自家倾家荡产。"
      - name: "自耕农李大柱"
        temperature: 0.45
        trait: "RISK_AVOIDANT"
        background: "家有薄田十五亩，生计自足。严厉告诫家中子弟不得与五等穷户往来作保。"
      - name: "自耕农周木匠"
        temperature: 0.40
        trait: "PRAGMATIC"
        background: "兼做木工手艺，稍有现银储蓄。对官法抑配心存戒备。"
      - name: "自耕农郑小四"
        temperature: 0.45
        trait: "TIMID"
        background: "新婚分家，得劣田十亩。胆小怕事，随波逐流。"

  # 6. 五等下等赤贫小农与佃农 (Ring-3 下等户: 骨肉生存、生死兄弟与泼皮逃跑)
  lower_peasants:
    count: 10
    base_name: "下等佃农"
    role_type: "peasant"
    privilege_ring: 3
    model: "deepseek-flash"
    mutation_rate: 0.15
    traits_pool: ["DESPERATE_SURVIVOR", "PATERNAL_PROTECTOR"]
    objective_function: "【骨肉保全·熬过严冬】不求富贵，只求全家不饿死、病弱妻儿能喝上一口热野菜汤、年关不至于典卖骨肉。天理良心，人总要活，逼到绝境便只能拼死求生！"
    background_template: "全家无地或仅有一二亩薄田，青黄不接。本不想借官银，却被公吏以'不借者加赋'强行抑配。只想全家骨肉团圆，熬过严冬见春耕。"
    assets_distribution:
      silver: { type: "uniform", min: 0.2, max: 1.5 }
      grain: { type: "uniform", min: 2.0, max: 4.5 } # 处于饿毙线边缘 (3.0 为及格)
      land: { type: "uniform", min: 1.0, max: 4.0 }
    members:
      - name: "五等佃农陈大"
        temperature: 0.50
        trait: "KINSHIP_PROTECTOR"
        objective_function: "【手足相依·护全幼弟】家中断炊，唯一的执念是保护幼弟陈二，死活不离不弃，宁死不卖弟妹。"
        background: "忠厚兄长，与弟相依为命，宁可自己饿死也不让差役加害弟弟。"
      - name: "五等佃农陈二"
        temperature: 0.60
        trait: "HOTHEAD_BROTHER"
        objective_function: "【誓保兄长·柴刀掀桌】年轻气盛，身上暗藏柴刀，若官差敢把枷锁扣在兄长脖子上，敢直接砍人！"
        background: "陈大之弟，血气方刚，视兄如父，绝不容差役侮辱兄长。"
      - name: "游民泼皮王二"
        temperature: 0.75
        trait: "OPPORTUNIST_FUGITIVE"
        mutation_rate: 0.35
        objective_function: "【卷款跑路·投奔绿林】早年跑过私盐，满脑子空手套白狼。只要贷出十两官银，转头就卷款潜逃伏牛山落草！"
        background: "村中游民泼皮，无田无业。表面号召穷邻结会，实则盘算拿到本金后连夜跑路。"
      - name: "老病佃农赵瞎子"
        trait: "VULNERABLE"
        background: "双目失明，携年迈老妻寄居破庙，全靠同村施舍度日。"
      - name: "流亡佃户刘孤儿"
        trait: "DESPERATE"
        background: "双亲早亡，替大户耕种二亩瘠田，青黄不接。"
      - name: "下等佃农张铁生"
        trait: "VULNERABLE"
        background: "佃种五亩涝洼田，秋收全看天意。"
      - name: "下等佃农李长工"
        trait: "TRADITIONAL"
        background: "长年在大户家帮佣，生计漂泊无依。"
      - name: "下等佃农冯破碗"
        trait: "DESPERATE"
        background: "家徒四壁，断粮数日。"
      - name: "下等佃农何瘦子"
        trait: "DESPERATE"
        background: "带三个幼子啼饥号寒，绝境挣扎。"
      - name: "下等佃农钱柴夫"
        trait: "TRADITIONAL"
        background: "平日上山砍柴贴补糊口，无力应付官贷利息。"

# 微观社会关系网 (拓扑边与人际异质张量: 恩怨/同盟/血亲/连坐怨恨)
social_relations:
  # 1. 官绅道统对弈边 (Political Rivalry / Moral Debate)
  - { from: "officials_01", to: "retired_officials_01", type: "PoliticalRivalry", weight: 4.5 }
  - { from: "clerks_01", to: "officials_01", type: "SubordinateTo", weight: 3.0 }
  - { from: "clerks_01", to: "retired_officials_01", type: "GentryPatronage", weight: 3.5 }

  # 2. 乡村自治与抬会结社边 (Community Alliance)
  - { from: "middle_peasants_01", to: "middle_peasants_02", type: "ClanAlliance", weight: 3.5 }
  - { from: "middle_peasants_01", to: "lower_peasants_01", type: "CommunityProtection", weight: 2.8 }

  # 3. 生死金石骨肉手足边 (Sacred Kinship)
  - { from: "lower_peasants_01", to: "lower_peasants_02", type: "KinshipSacred", weight: 5.0 }

  # 4. 塑料投机与背叛暗流边 (Opportunistic Tie)
  - { from: "lower_peasants_03", to: "lower_peasants_04", type: "OpportunisticTie", weight: 1.0 }

  # 5. 强配连坐嫌隙与怨恨边 (Compulsory Coercion & Resentment)
  - { from: "middle_peasants_02", to: "lower_peasants_03", type: "HostileCoercion", weight: 4.2 }
  - { from: "clerks_01", to: "lower_peasants_01", type: "ExtortionPressure", weight: 3.8 }
  - { from: "clerks_02", to: "lower_peasants_01", type: "ExtortionPressure", weight: 3.8 }

# 外部冲击与同侪压力生成器 (飞轮第一阶)
exogenous_shocks:
  neighbor_promotion:
    probability: 0.25
    kpi_pressure_delta: 0.30             # 隔壁县令 120% 达标升官，引发本县知县同侪恐慌
  neighbor_peasant_revolt:
    probability: 0.25
    clerk_fear_delta: 0.40               # 隔壁县严苛逼债激起民变杀官，基层吏员怕走夜路
  climate_locust_drought:
    probability: 0.20
    crop_yield_multiplier: 0.65          # 蝗旱灾害导致收成骤降 35%
  bumper_price_crash:
    probability: 0.20
    grain_price_multiplier: 0.60         # 谷贱伤农：粮价暴跌导致现银兑换现金流断裂

# 双极心智极化触发条件 (飞轮第二阶)
mental_polarity:
  peasant_desperation_revolt:            # 极恶模式：恶向胆边生
    condition: "grain < 0.4 * subsistence_need AND clerk_action == 'ENFORCE_CANGUE_ARREST'"
    base_prob: 0.35
    action: "KILL_OFFICIAL_REVOLT"       # 物理消灭微观中介，柴刀夺粮
  clerk_self_preservation_mercy:         # 极善/自保模式：恻隐与怕走夜路
    condition: "clerk_fear_index > 0.70 OR (is_kinsman AND random() < 0.20)"
    base_prob: 0.45
    action: "SLACK_OFF_AND_MERCY"        # 暗中划销底册、少记二斗，释放系统排污阀
  middle_peasant_mutual_aid:             # 守望相助模式
    condition: "grain > 18.0 AND random() < 0.25"
    base_prob: 0.25
    action: "LEND_GRAIN_TO_NEIGHBOR"

# 演化分叉判定规则 (飞轮第四阶)
bottom_up_evolution_outcomes:
  branch_A_clerk_sabotage:
    base_probability: 0.65               # 概率 65%：胥吏为保住火耗与头子钱，诬告互助组"私相结社、图谋抗税"予以扑灭
    consequence: "INNOVATION_SLASHED"    # 创新火种熄灭，激化底层矛盾，加速滑向杀官造反
  branch_B_magistrate_merge:
    base_probability: 0.25               # 概率 25%：开明知县顶住胥吏阻挠，正式将自愿结会纳入官法
    consequence: "SHORT_TERM_STABILITY"  # 坏账与逃亡率大幅下降，迎来短暂黄金期
  branch_C_re_alienation_cycle:
    trigger_ticks_after_merge: 3         # 合并后 3 个季度内：顶层提举司下达递增指标
    consequence: "COMPULSORY_SOCIETY"    # 自愿结会重新异化为官办强制五人连坐，民间智慧被彻底污染
