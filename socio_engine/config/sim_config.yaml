# 场景与时间线配置 (基于明万历初年歙县真实历史档案)
scenario:
  name: "明万历初年徽州府歙县丰乐河畔村落赋役与丝绢博弈实验 (五年全任期)"
  historical_baseline_doc: "docs/HISTORICAL_BASELINE.md"
  county: "南直隶 徽州府 歙县"
  historical_year_start: 1573 # 万历元年
  historical_year_end: 1577   # 万历五年
  max_ticks: 20               # 模拟 20 个季度 (整整 5 年全周期)
  tick_unit: "QUARTER"

# 数据库配置
database:
  db_path: "database/socio_sim.db"
  wal_mode: true
  busy_timeout_ms: 10000

# 外部五年真实历史大事件日程表 (World Milestones 注入宏观认知)
historical_timeline_events:
  1: "【万历元年春】顾知县新官到任，申明户部考成法，户房钱老吏暗借火耗平余浮收。"
  2: "【万历元年夏】青黄不接，夏税折麦催征紧迫，孙掌柜当铺放出月息三分高利贷兼并田产。"
  3: "【万历元年秋】歙县秋粮晚稻大收，水尾李生田地无水减产，遭差役登门逼催丝绢税。"
  4: "【万历元年冬】冬税解京，知县完成第一年考成，太仓实银尚可，但下户小农现金流告罄。"
  5: "【万历二年春】春旱严重，丰乐河水势骤减，上村陈氏筑坝截水，下村李氏扬言携械死斗。"
  6: "【万历二年夏】小农借贷逾期，孙典当启动‘绝卖条款’强行兼并水尾田产，钱老吏从中做假账。"
  7: "【万历二年秋】徽州府学岁考大比，吴秀才家长子吴天麟进场应试，关乎全族生员优免前程。"
  8: "【万历二年冬】岁考放榜！吴天麟高中秀才，吴家获得二免特权，钱粮亏空转嫁给轮值里长！"
  9: "【万历三年春】军户帅嘉谟持《大明会典》上告巡抚，称丝绢8780匹不应由歙县独扛，朝野震动！"
  10: "【万历三年夏】徽州知府崔孔昕发紧急牌面：严禁六县均摊，限令知县速捕帅嘉谟归案！"
  11: "【万历三年秋】应天巡抚宋仪望批示：设法均平，严防民变！顾知县被夹在中间，启动清勘对簿。"
  12: "【万历三年冬】户部严催旧绢，歙县士绅汪道昆、生员万民联名上呈血书，誓死罢考罢市抗税！"
  13: "【万历四年春】巡按直隶监察御史邓文宪下驻徽州，严查贪墨私耗，召六县知县合议大辩论。"
  14: "【万历四年夏】婺源五县士民暴动围攻府衙，程任卿带头抗辩，歙县士子合院罢考相抗！"
  15: "【万历四年秋】顾知县呈报全县清丈隐田16万亩实录，力图通过做大田土底盘稀释税负。"
  16: "【万历四年冬】朝廷折中定案：减免歙县丝绢税，五县分摊部分银米，帅嘉谟流放、程任卿入狱。"
  17: "【万历五年春】内阁首辅张居正下达全国清丈大令，全县全面重造鱼鳞图册，清查诡寄。"
  18: "【万历五年夏】赵新吏递交密告黑材料，钱老吏私隐田产被查处，孙典当高利贷受整治。"
  19: "【万历五年秋】全县鱼鳞图册大告成功，地籍归户清册定案，赋役一条鞭法全面落地。"
  20: "【万历五年冬】五年考成届满！顾知县因清丈有功、抚平丝绢大难，选授刑科给事中升迁入京！"

# 数据库配置
database:
  db_path: "database/socio_sim.db"
  wal_mode: true
  busy_timeout_ms: 10000

# 真实宏观经济参数 (严格对齐万历十六年条鞭由票与丝绢全书)
macro_environment:
  initial_treasury_silver: 2500.0          # 县太仓实存银 (两)
  imperial_tax_quota: 6145.0               # 朝廷下达歙县的人丁丝绢与夏秋二税考成定额
  base_grain_price: 1.0                    # 正常平年米价 (1.0 两白银 / 石大米)
  official_tax_per_mu: 0.0801              # 万历税票官定税额: 0.0801 两/亩
  silk_surcharge_per_mu: 0.0210            # 歙县分摊的人丁丝绢加派额: 0.0210 两/亩
  official_surtax_rate: 0.15               # 官定火耗折银耗费率: 15%
  subsistence_grain_per_tick: 3.0          # 每户单季最低糊口粮 (石)

# 组织信道与滤波参数 (RFC-016)
information_channel:
  reporting_loss_rate: 0.35                # 基层灾情与抗税向知县汇报的滤波失真率
  magistrate_audit_frequency: 2            # 知县每 2 个季度下乡实地清丈一次

# 真实微观人口与家庭谱系配置 (Population & Micro-Ecological Lineages)
population:
  magistrates:
    - id: "magistrate_gu"
      name: "顾知县"
      role_type: "magistrate"
      privilege_ring: 1
      model: "deepseek-flash"
      temperature: 0.3
      background: "万历二年进士，南直隶流官，初到任不通钱谷，急于完成考绩升迁，想在丝绢案中维持两造平衡"
      initial_assets: { silver: 150.0, grain: 60.0, land: 0.0 }

    - id: "vice_magistrate_liu"
      name: "刘县丞 (分管水利粮马)"
      role_type: "vice_magistrate"
      privilege_ring: 1
      model: "deepseek-flash"
      temperature: 0.4
      trait: "PRAGMATIC_BUREAUCRAT"
      background: "南直隶推官转任县丞，常驻东花厅分管粮马水利，与本土汪道昆、吴员外等大族为通家之好，遇事圆滑保身"
      initial_assets: { silver: 90.0, grain: 45.0, land: 20.0 }

  clerks:
    - id: "clerk_qian"
      name: "钱老吏 (户房经办)"
      role_type: "clerk"
      privilege_ring: 2
      model: "deepseek-flash"
      temperature: 0.5
      trait: "GREEDY_CALCULATING"
      background: "把持户房二十余年，熟悉各都山川田亩册籍漏洞，与城关孙典当为连襟，暗中抽取火耗平余"
      initial_assets: { silver: 80.0, grain: 40.0, land: 35.0 }

    - id: "clerk_zhao"
      name: "赵新吏 (户房副役)"
      role_type: "clerk"
      privilege_ring: 2
      model: "deepseek-flash"
      temperature: 0.7
      trait: "OPPORTUNIST_AMBITIOUS"
      background: "西乡李氏姑表外甥，一直觊觎正书吏肥缺，企图借知县查账告发钱吏私弊，取而代之"
      initial_assets: { silver: 20.0, grain: 25.0, land: 15.0 }

    - id: "clerk_crime_ma"
      name: "马司吏 (刑房掌案)"
      role_type: "clerk_crime"
      privilege_ring: 2
      model: "deepseek-flash"
      temperature: 0.6
      trait: "CORRUPT_LEGALIST"
      background: "把持刑房卷宗十五年，精研《大明律》与词讼受贿，原告被告通吃，擅长按银两多寡颠倒案情供词"
      initial_assets: { silver: 45.0, grain: 30.0, land: 18.0 }

    - id: "bailiff_captain_wu"
