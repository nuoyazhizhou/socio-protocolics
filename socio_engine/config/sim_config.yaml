# 社会网络拓扑关系定义 (供 Rust PySocialGraph 加速计算)
social_relations:
  # 行政上下级与官衙制衡 (SubordinateTo)
  - { from: "vice_magistrate_liu", to: "magistrate_gu", type: "SubordinateTo", weight: 1.2 }
  - { from: "clerk_qian", to: "magistrate_gu", type: "SubordinateTo", weight: 1.0 }
  - { from: "clerk_zhao", to: "magistrate_gu", type: "SubordinateTo", weight: 0.8 }
  - { from: "clerk_crime_ma", to: "magistrate_gu", type: "SubordinateTo", weight: 0.9 }
  - { from: "bailiff_captain_wu", to: "magistrate_gu", type: "SubordinateTo", weight: 1.0 }
  - { from: "bailiff_captain_wu", to: "clerk_qian", type: "SubordinateTo", weight: 2.2 }
  - { from: "peasant_zhao_lijia", to: "clerk_qian", type: "SubordinateTo", weight: 2.0 }

  # 利益与姻亲同盟 (CollusionAlliance)
  - { from: "clerk_qian", to: "gentry_sun", type: "CollusionAlliance", weight: 4.0 }
  - { from: "vice_magistrate_liu", to: "gentry_wu", type: "CollusionAlliance", weight: 3.0 }
  - { from: "clerk_crime_ma", to: "gentry_sun", type: "CollusionAlliance", weight: 2.5 }

  # 暴力催逼与差役勒索 (CoercionHarass)
  - { from: "bailiff_captain_wu", to: "peasant_zhao_lijia", type: "CoercionHarass", weight: 3.5 }
  - { from: "bailiff_captain_wu", to: "peasant_li_tailwater", type: "CoercionHarass", weight: 2.5 }

  # 宗族世仇 (HostileRival)
  - { from: "peasant_chen_hothead", to: "peasant_li_tailwater", type: "HostileRival", weight: 4.5 }

  # 宗族庇护与挂靠 (PatronClient)
  - { from: "peasant_wu_scholar", to: "gentry_wu", type: "PatronClient", weight: 2.5 }

  # 高利贷债务盘剥 (DebtorTo)
  - { from: "peasant_li_tailwater", to: "gentry_sun", type: "DebtorTo", weight: 3.5 }

  # 赋税征缴链 (TaxPayerTo)
  - { from: "peasant_wu_scholar", to: "peasant_zhao_lijia", type: "TaxPayerTo", weight: 1.5 }
  - { from: "peasant_chen_elder", to: "peasant_zhao_lijia", type: "TaxPayerTo", weight: 1.2 }
  - { from: "peasant_li_tailwater", to: "peasant_zhao_lijia", type: "TaxPayerTo", weight: 0.8 }
  - { from: "peasant_chen_hothead", to: "peasant_zhao_lijia", type: "TaxPayerTo", weight: 1.0 }
