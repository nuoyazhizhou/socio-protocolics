      name: "吴员外 (致仕乡绅)"
      role_type: "gentry"
      privilege_ring: 2
      model: "deepseek-flash"
      temperature: 0.4
      trait: "PATRON_ELITE"
      background: "前任国子监监生，吴秀才宗族大房长辈，拥有平畈上田百亩，享有免丁免粮特权，接受同宗佃户挂靠"
      initial_assets: { silver: 600.0, grain: 900.0, land: 120.0 }

    - id: "gentry_sun"
