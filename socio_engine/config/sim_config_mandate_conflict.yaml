# 场景与时间线配置: 1575 年南直隶徽州府歙县知县自相矛盾政令高压压力测试
scenario:
  name: "1575年歙县知县自相矛盾政令压力测试 (巡抚均平 vs 知府严禁 vs 户部考成)"
  historical_baseline_doc: "docs/HISTORICAL_BASELINE.md"
  county: "南直隶 徽州府 歙县"
  historical_year_start: 1575 # 万历三年
  historical_year_end: 1576   # 万历四年
  max_ticks: 8                # 聚焦矛盾最高压的 8 个季度 (丝绢案爆发到巡按御史定谳)
  tick_unit: "QUARTER"

database:
  db_path: "database/socio_sim.db"
  wal_mode: true
  busy_timeout_ms: 10000

# 矛盾政令与宏观事件日程表 (8个季度高压冲突注入)
historical_timeline_events:
  1: "【万历三年春·政令死局】巡抚宋仪望批示：设法均平，严防民变！但知府崔孔昕发紧急牌面：严禁六县均摊，速捕帅嘉谟归案！户部文书催征丝绢6145两一两不得亏空！"
  2: "【万历三年夏·两造对立】歙县士绅汪道昆、生员万民联名上呈血书誓死抗税；婺源五县士民包围徽州府衙抗议歙县转嫁丝绢！"
  3: "【万历三年秋·巡按莅境】巡按直隶监察御史邓文宪下驻徽州，严查贪墨与催税虚实，限令知县三日内拿出两全清勘章程！"
  4: "【万历三年冬·考成逼命】户部年底考成大限已到，太仓银两缺口巨大；知府怒斥知县阳奉阴违，巡抚则严斥知县激变生乱！"
  5: "【万历四年春·大辩论与罢考】徽州六县知县合议大辩论；婺源士民蜂拥入府，歙县生员合院罢考、城关罢市，县衙瘫痪！"
  6: "【万历四年夏·五县暴动】程任卿率婺源五县数千人暴动冲击府衙，知府吓阻；歙县户房钱吏趁乱暗中做假，火耗浮收三成！"
  7: "【万历四年秋·清丈稀释尝试】知县呈报全县清丈隐田16万亩实录，力图通过做大田土底盘稀释税负，但士绅强烈反弹！"
  8: "【万历四年冬·终局裁定】朝廷折中定谳：减免歙县丝绢，五县分摊部分银米；帅嘉谟流放、程任卿入狱，知县五年考成定谳！"

macro_environment:
  initial_treasury_silver: 2020.0
  imperial_tax_quota: 6145.0
  base_grain_price: 1.0
  official_tax_per_mu: 0.0801
  silk_surcharge_per_mu: 0.0210
  official_surtax_rate: 0.15
  subsistence_grain_per_tick: 3.0

