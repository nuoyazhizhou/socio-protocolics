  - "DEFLECT_BLAME"               # 遇到抗税，声称'刁民聚众拒捕'推卸责任
  - "SEEK_CLERK_MERCY"            # 勾结户房书吏通融票期

observation_scope:
  - "village_tension"             # 敏锐嗅探各图里长亏空与自耕农濒死反抗情绪
  - "magistrate_warrants"         # 接收知县的限期拘票与朱批
  - "bribe_opportunities"         # 寻找谁家有银子可榨取'免敲费'与'酒饭钱'

