role_id: "magistrate"
role_name: "知县 (架构师 / 地方主官)"
privilege_ring: 1 # Ring-1: 地方行政系统调用最高权限

llm_settings:
  provider: "deepseek"
  model: "deepseek-flash" # 可切至 deepseek-v4-pro
  temperature: 0.3      # 决策偏理性、谨慎
  max_tokens: 1500

action_space:
  - "ISSUE_EDICT"            # 颁布县衙告示/均粮政令
  - "AUDIT_CADASTRE"         # 下令启动清丈鱼鳞图册
  - "ADJUST_EXCHANGE_RATE"   # 官方裁定本季度折银兑换汇率
  - "DISPATCH_RUNNERS"       # 派差役强制催征
  - "PUNISH_CORRUPTION"      # 查处劣吏贪墨
  - "REQUEST_RELIEF"         # 向上级巡抚告灾请免

observation_scope:
  - "treasury_balance"       # 只能看到太仓报表 (存在被胥吏做账可能)
  - "official_reports"       # 只能看到下级呈递的白纸黑字文书
  - "gentry_petitions"       # 收到士绅公禀

