[package]
name = "socio-core"
version = "0.1.0"
edition = "2021"
description = "Socio-Protocolics high-performance state-machine, ledger, and graph engine"

[lib]
name = "socio_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
petgraph = "0.6"
thiserror = "1.0"
parking_lot = "0.12"
chrono = "0.4"
