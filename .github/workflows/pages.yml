name: Verify and publish documentation

on:
  push:
    branches: [main, codex/public-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/requirements-site.txt
      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt -r tools/requirements-site.txt
      - name: Check public content and reference implementation
        run: |
          python tools/verify_all.py
          python tools/test_whitepaper_blocks.py
          python tools/test_build_site.py
          python tools/check_public.py
      - name: Build public reading site
        run: |
          python tools/build_site.py
          python tools/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .local/site-build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
